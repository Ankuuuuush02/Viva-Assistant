<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viva Assistant</title>
  <style>
    body {
      background-color: #0e0e10;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    button {
      background-color: #00e676;
      border: none;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      padding: 18px;
      font-size: 1rem;
      font-weight: bold;
      color: #000;
      cursor: pointer;
      margin-bottom: 25px;
    }
    button:disabled {
      background-color: #555;
      color: #888;
    }
    .box {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      box-sizing: border-box;
      line-height: 1.5;
      font-size: 1rem;
      word-break: break-word;
      min-height: 100px;
    }
    .user-q {
      color: #00e676;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <button id="askBtn" onclick="startListening()">TAP TO RECORD</button>
  <div class="box" id="result">Result will appear here...</div>

  <script>
    const btn = document.getElementById("askBtn");
    const result = document.getElementById("result");

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function startListening() {
      if (!SpeechRecognition) {
        result.innerText = "Error: Browser me speech recognition support nahi hai (Chrome use karo).";
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "hi-IN"; // Hindi aur Hinglish voice support
      recognition.interimResults = false;

      recognition.onstart = () => {
        btn.disabled = true;
        btn.innerText = "Listening...";
        result.innerText = "Bolna shuru karo...";
      };

      recognition.onspeechend = () => {
        recognition.stop();
        btn.innerText = "Processing...";
      };

      recognition.onresult = async (event) => {
        const spokenText = event.results[0][0].transcript;
        result.innerHTML = `<div class="user-q">Pucha: "${spokenText}"</div>Soch raha hu...`;

        try {
          const res = await fetch("/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: spokenText })
          });
          const data = await res.json();
          if (data.error) {
            result.innerText = "Error: " + data.error;
          } else {
            result.innerHTML = `<div class="user-q">Pucha: "${spokenText}"</div>${data.answer}`;
          }
        } catch (err) {
          result.innerText = "Server Error: " + err.message;
        } finally {
          btn.disabled = false;
          btn.innerText = "TAP TO RECORD";
        }
      };

      recognition.onerror = (event) => {
        result.innerText = "Mic Error: " + event.error;
        btn.disabled = false;
        btn.innerText = "TAP TO RECORD";
      };

      recognition.start();
    }
  </script>
</body>
</html>
